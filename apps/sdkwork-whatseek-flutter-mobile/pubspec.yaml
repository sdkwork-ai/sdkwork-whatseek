name: sdkwork_whatseek_flutter_mobile
description: WhatSeek (问寻) AI-native super app Flutter mobile client.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  im_sdk_composed:
    path: ../../../sdkwork-im/sdks/sdkwork-im-sdk/sdkwork-im-sdk-flutter/composed/im_sdk_composed
  sdkwork_appstore_app_sdk:
    path: ../../../sdkwork-appstore/sdks/sdkwork-appstore-app-sdk/sdkwork-appstore-app-sdk-dart
  shared_preferences: ^2.5.5
  sdkwork_whatseek_flutter_mobile_apps:
    path: packages/sdkwork_whatseek_flutter_mobile_apps
  sdkwork_whatseek_flutter_mobile_chat:
    path: packages/sdkwork_whatseek_flutter_mobile_chat
  sdkwork_whatseek_flutter_mobile_commons:
    path: packages/sdkwork_whatseek_flutter_mobile_commons
  sdkwork_whatseek_flutter_mobile_contacts:
    path: packages/sdkwork_whatseek_flutter_mobile_contacts
  sdkwork_whatseek_flutter_mobile_core:
    path: packages/sdkwork_whatseek_flutter_mobile_core
  sdkwork_whatseek_flutter_mobile_messages:
    path: packages/sdkwork_whatseek_flutter_mobile_messages
  sdkwork_whatseek_flutter_mobile_profile:
    path: packages/sdkwork_whatseek_flutter_mobile_profile
  sdkwork_whatseek_flutter_mobile_shell:
    path: packages/sdkwork_whatseek_flutter_mobile_shell

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

# Sibling source SDK family (sdkwork-im), pinned to the local workspace the
# same way pnpm-workspace.yaml pins the TypeScript sibling packages. The
# composed consumer package is the only import seam; the overrides keep the
# transitive generated transport and the shared common package on the sibling
# sources instead of a registry that does not host them.
dependency_overrides:
  im_sdk_composed:
    path: ../../../sdkwork-im/sdks/sdkwork-im-sdk/sdkwork-im-sdk-flutter/composed/im_sdk_composed
  im_sdk_generated:
    path: ../../../sdkwork-im/sdks/sdkwork-im-sdk/sdkwork-im-sdk-flutter/generated/server-openapi
  sdkwork_common_flutter:
    path: ../../../sdkwork-sdk-commons/sdkwork-sdk-common-flutter

flutter:
  uses-material-design: true
