packages:
  - apps/sdkwork-whatseek-common
  - apps/sdkwork-whatseek-common/packages/*
  - apps/sdkwork-whatseek-h5
  - apps/sdkwork-whatseek-h5/packages/*
  - apps/sdkwork-whatseek-pc
  - apps/sdkwork-whatseek-pc/packages/*
  - apps/sdkwork-whatseek-mini-program
  - apps/sdkwork-whatseek-mini-program/packages/*
  # Sibling SDKWork source dependencies (PNPM_WORKSPACE_DEPENDENCY_SPEC.md §2):
  # declared exactly once here, consumed via `workspace:*`.
  - ../sdkwork-im/sdks/sdkwork-im-sdk/sdkwork-im-sdk-typescript
  - ../sdkwork-sdk-commons/sdkwork-sdk-common-typescript
  - ../sdkwork-utils/packages/sdkwork-utils-typescript

allowBuilds:
  esbuild: true

# Sibling SDKWork foundation packages must always resolve to the local
# workspace members (PNPM_WORKSPACE_DEPENDENCY_SPEC.md): dependency ranges
# declared by linked SDK packages (e.g. @sdkwork/im-sdk → @sdkwork/sdk-common
# ^1.0.2) would otherwise hit the npm registry and skew against the sibling
# source the workspace is pinned to.
overrides:
  "@sdkwork/sdk-common": workspace:*
  "@sdkwork/utils": workspace:*

catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  react-router-dom: ^7.18.2
  zustand: ^5.0.12
  i18next: ^26.3.6
  react-i18next: ^17.0.11
  lucide-react: ^1.31.0
  clsx: ^2.1.1
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tailwindcss/typography": ^0.5.19
  typescript: ^6.0.2
  vite: ^8.0.3
  "@vitejs/plugin-react": ^6.0.5
  vitest: ^4.1.10
  jsdom: 29.1.1
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@testing-library/dom": 10.4.1
  "@testing-library/react": 16.3.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/user-event": ^14.6.1
  esbuild: ^0.25.10
  "miniprogram-api-typings": ^4.1.0
